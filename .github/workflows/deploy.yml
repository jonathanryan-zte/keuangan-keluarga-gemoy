# Menerbitkan isi folder app/ ke GitHub Pages.
#
# Tidak ada langkah build: aplikasinya modul ES biasa, jadi berkasnya disalin
# apa adanya. Alamat Apps Script tidak ditanam di sini — Ryan menempelkannya
# sekali lewat layar pertama aplikasi, dan tersimpan di HP masing-masing.
name: Terbitkan ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pasang.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: pasang
        uses: actions/deploy-pages@v4
